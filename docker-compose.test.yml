version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: quetzaltic_test
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api-test:
    build:
      context: .
      dockerfile: apps/quetzaltic-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@postgres-test:5432/quetzaltic_test?schema=audit
      PROD_DB_URL: postgresql://postgres:postgres_password@postgres-test:5432/quetzaltic_test?schema=prod
      AUDIT_DB_URL: postgresql://postgres:postgres_password@postgres-test:5432/quetzaltic_test?schema=audit
      JWT_SECRET: super_secure_hardening_test_secret_32_chars
      NODE_ENV: test
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); })" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ui-test:
    build:
      context: .
      dockerfile: apps/quetzaltic-ui/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api-test:
        condition: service_healthy

networks:
  default:
    name: quetzaltic-network
